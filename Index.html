<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Jardim</title>
    <style>
        /* Reset básico */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            background-color: #fdfcf9;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* Container centralizado mais amplo para destacar as imagens */
        .container {
            position: relative;
            max-width: 1440px;
            width: 100%;
            margin: 0 auto;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        img {
            width: 100%;
            height: auto;
            display: block;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }

        /* Área clicável calibrada sobre o retângulo CONTATO */
        .btn-contato {
            position: absolute;
            top: 94.5%;
            left: 50%;
            transform: translateX(-50%);
            width: 12.5%;
            height: 1.1%;
            cursor: pointer;
            z-index: 10;
        }

        /* Ajuste para telas pequenas */
        @media (max-width: 1440px) {
            .container {
                padding: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="O Jardim-1.png" alt="O Jardim">
        <a 
            href="https://wa.me/5511999946969" 
            target="_blank" 
            rel="noopener noreferrer" 
            class="btn-contato" 
            aria-label="Entrar em contato pelo WhatsApp">
        </a>
    </div>
</body>
</html>
